<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; media-src 'self'; base-uri 'none'">
  <title>James — Private Access</title>
  <link rel="preload" as="image" href="/login-art-dark.png">
  <style id="loginOnlyStyle">
    :root{color-scheme:dark;--paper:#0b1c30;--ink:#f2eadb;--muted:#c5ced9;--gold:#d1b781;--line:rgba(214,185,131,.42);--card:rgba(12,29,48,.92);--input:#10243b;--art:url('/login-art-dark.png');--veil:rgba(3,14,29,.58)}
    html[data-theme="light"]{color-scheme:light;--paper:#f6f2e9;--ink:#172238;--muted:#5e6570;--gold:#855d24;--line:#aa9470;--card:rgba(255,252,245,.94);--input:#fffdf8;--art:url('/login-art-light.png');--veil:rgba(255,252,244,.5)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);isolation:isolate;font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink)}
    body::before{content:"";position:fixed;inset:0;z-index:-2;background-image:linear-gradient(var(--veil),var(--veil)),var(--art);background-size:cover;background-position:center;filter:blur(3px)}
    #loginScene{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;pointer-events:none;filter:blur(3px);opacity:0;transition:opacity .2s ease}
    #loginScene.playing{opacity:1}
    .login-brand{position:fixed;top:clamp(24px,5vw,64px);left:clamp(24px,6vw,88px);font:clamp(1.7rem,3.4vw,3rem) Georgia,serif;letter-spacing:.17em;color:var(--gold)}
    main{width:min(100%,430px);padding:34px;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 18px 70px rgba(0,0,0,.3);backdrop-filter:blur(16px)}
    small{display:block;color:var(--gold);font-weight:700;letter-spacing:.22em}
    h1{font:2.4rem Georgia,serif;font-weight:400;margin:8px 0 10px}
    p{color:var(--muted);line-height:1.5}
    label{display:block;margin-top:18px;font-size:.82rem;font-weight:700;letter-spacing:.08em}
    input{width:100%;margin-top:7px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--input);color:var(--ink);font:inherit}
    button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:999px;background:linear-gradient(180deg,#9a752d,#80601f);color:white;font:inherit;font-weight:700;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}
    #message{min-height:24px;margin:14px 0 0;color:var(--ink);font-size:.9rem}
    :is(input,button):focus-visible{outline:3px solid var(--gold);outline-offset:3px}
    @media(max-height:540px){body{padding-top:85px}.login-brand{position:absolute;top:20px}main{padding:24px}}
  </style>
</head>
<body>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('jamesTheme')==='light'?'light':'dark';}catch(_){}</script>
  <video id="loginScene" muted playsinline autoplay preload="auto" aria-hidden="true" tabindex="-1"></video>
  <div class="login-brand" aria-hidden="true">JAMES</div>
  <main aria-label="Sign in to James">
    <small>PRIVATE ACCESS</small>
    <h1>Welcome back.</h1>
    <p>Sign in to open this private James workspace.</p>
    <form id="loginForm">
      <label for="email">EMAIL</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">PASSWORD</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submitButton" type="submit">Sign in</button>
      <p id="message" role="alert" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const sceneVideo=document.querySelector('#loginScene');
    const sceneHour=new Date().getHours();
    const sceneName=sceneHour<6||sceneHour>=21?'night':sceneHour<11?'morning':sceneHour<17?'noon':'evening';
    sceneVideo.src='/login-scene-'+sceneName+'.mp4';
    sceneVideo.addEventListener('playing',()=>sceneVideo.classList.add('playing'),{once:true});
    sceneVideo.addEventListener('error',()=>{sceneVideo.classList.remove('playing');sceneVideo.removeAttribute('src');});
    sceneVideo.play().catch(()=>sceneVideo.classList.remove('playing'));
    // Do not loop/restart the approved five-second clip while awaiting sign-in.
    sceneVideo.addEventListener('ended',()=>sceneVideo.pause(),{once:true});
    const form = document.querySelector('#loginForm');
    const button = document.querySelector('#submitButton');
    const message = document.querySelector('#message');

    form.addEventListener('submit', async event => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = '';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: form.email.value,
            password: form.password.value
          })
        });

        if (!response.ok) throw new Error('Sign-in failed');
        try { sessionStorage.removeItem('jamesIntroDate'); } catch (_) {}
        // Load the authenticated application into this document without discarding
        // the already playing decorative scene. No app request is made before login.
        const appResponse = await fetch('/', { credentials: 'same-origin', cache: 'no-store' });
        if (!appResponse.ok) throw new Error('Unable to open James');
        const html = await appResponse.text();
        const parsed = new DOMParser().parseFromString(html, 'text/html');
        if (!parsed.querySelector('#intro') || !parsed.querySelector('#app')) {
          throw new Error('Invalid James application response');
        }
        const styles=[...parsed.head.querySelectorAll('link[rel="stylesheet"]')];
        const staged=styles.map(link=>{const node=document.importNode(link,true);node.media='not all';document.head.append(node);return node;});
        await Promise.all(staged.map(link=>new Promise((resolve,reject)=>{
          if(link.sheet)return resolve();
          link.addEventListener('load',resolve,{once:true});link.addEventListener('error',reject,{once:true});
        })));
        const scripts = [...parsed.body.querySelectorAll('script')].map(node=>({
          src:node.getAttribute('src'),type:node.getAttribute('type'),text:node.textContent
        }));
        const bodyNodes = [...parsed.body.childNodes].filter(node=>node.nodeName!=='SCRIPT');
        // Preserve the existing media node and first frame across authentication.
        const existingScene = sceneVideo;
        for(const node of bodyNodes)document.body.append(document.importNode(node,true));
        const intro=document.querySelector('#intro');
        // Keep the existing video connected through authentication.
        existingScene.classList.add('playing');
        existingScene.style.opacity='1';existingScene.style.zIndex='11';existingScene.style.filter='none';
        // Login-only CSS is removed below: retain full-viewport media geometry inline.
        existingScene.style.position='fixed';existingScene.style.inset='0';
        existingScene.style.width='100%';existingScene.style.height='100%';
        existingScene.style.objectFit='cover';existingScene.style.pointerEvents='none';
        intro.style.zIndex='12';intro.style.backgroundImage='var(--welcome-wash)';
        document.getElementById('loginOnlyStyle')?.remove();
        for(const link of staged)link.media='all';
        document.querySelector('.login-brand')?.remove();
        document.querySelector('main[aria-label="Sign in to James"]')?.remove();
        document.documentElement.dataset.theme = document.documentElement.dataset.theme || 'dark';
        for (const script of scripts) {
          if (script.src) {
            await new Promise((resolve,reject)=>{
              const node=document.createElement('script');
              if(script.type)node.type=script.type;
              node.src=script.src;
              node.onload=resolve;node.onerror=reject;
              document.body.append(node);
            });
          } else if (script.text.trim()) {
            const node=document.createElement('script');node.textContent=script.text;
            document.body.append(node);
          }
        }
        document.dispatchEvent(new Event('DOMContentLoaded'));
        window.dispatchEvent(new Event('load'));
      } catch {
        message.textContent = 'James could not verify those credentials.';
        form.password.value = '';
        form.password.focus();
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
