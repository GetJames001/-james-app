<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; form-action 'self'; base-uri 'none'">
  <title>James — Private Access</title>
  <style>
    :root{color-scheme:dark;--paper:#0b1c30;--ink:#f2eadb;--muted:#c5ced9;--gold:#d1b781;--line:rgba(214,185,131,.42);--card:rgba(12,29,48,.92);--input:#10243b;--art:url('/login-art-dark.png');--veil:rgba(3,14,29,.58)}
    html[data-theme="light"]{color-scheme:light;--paper:#f6f2e9;--ink:#172238;--muted:#5e6570;--gold:#855d24;--line:#aa9470;--card:rgba(255,252,245,.94);--input:#fffdf8;--art:url('/login-art-light.png');--veil:rgba(255,252,244,.5)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);isolation:isolate;font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink)}
    body::before{content:"";position:fixed;inset:0;z-index:-2;background-image:linear-gradient(var(--veil),var(--veil)),var(--art);background-size:cover;background-position:center;filter:blur(3px)}
    .login-brand{position:fixed;top:clamp(24px,5vw,64px);left:clamp(24px,6vw,88px);font:clamp(1.7rem,3.4vw,3rem) Georgia,serif;letter-spacing:.17em;color:var(--gold)}
    main{width:min(100%,430px);padding:34px;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 18px 70px rgba(0,0,0,.3);backdrop-filter:blur(16px)}
    small{display:block;color:var(--gold);font-weight:700;letter-spacing:.22em}
    h1{font:2.4rem Georgia,serif;font-weight:400;margin:8px 0 10px}
    p{color:var(--muted);line-height:1.5}
    label{display:block;margin-top:18px;font-size:.82rem;font-weight:700;letter-spacing:.08em}
    input{width:100%;margin-top:7px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--input);color:var(--ink);font:inherit}
    button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:999px;background:linear-gradient(180deg,#9a752d,#80601f);color:white;font:inherit;font-weight:700;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}
    #message{min-height:24px;margin:14px 0 0;color:var(--ink);font-size:.9rem}
    :is(input,button):focus-visible{outline:3px solid var(--gold);outline-offset:3px}
    @media(max-height:540px){body{padding-top:85px}.login-brand{position:absolute;top:20px}main{padding:24px}}
  </style>
</head>
<body>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('jamesTheme')==='light'?'light':'dark';}catch(_){}</script>
  <div class="login-brand" aria-hidden="true">JAMES</div>
  <main aria-label="Sign in to James">
    <small>PRIVATE ACCESS</small>
    <h1>Welcome back.</h1>
    <p>Sign in to open this private James workspace.</p>
    <form id="loginForm">
      <label for="email">EMAIL</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">PASSWORD</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submitButton" type="submit">Sign in</button>
      <p id="message" role="alert" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const form = document.querySelector('#loginForm');
    const button = document.querySelector('#submitButton');
    const message = document.querySelector('#message');

    form.addEventListener('submit', async event => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = '';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: form.email.value,
            password: form.password.value
          })
        });

        if (!response.ok) throw new Error('Sign-in failed');
        try { sessionStorage.removeItem('jamesIntroDate'); } catch (_) {}
        window.location.replace('/');
      } catch {
        message.textContent = 'James could not verify those credentials.';
        form.password.value = '';
        form.password.focus();
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
