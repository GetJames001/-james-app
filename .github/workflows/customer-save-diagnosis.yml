name: Customer save integrity
on:
  push:
    branches: [work/customer-save-diagnosis-20261113]
  pull_request:
    branches: [fix/calendar-refresh-diagnosis-20261031]
permissions:
  contents: read
jobs:
  customer-autofill:
    if: github.event_name == 'push' || github.head_ref == 'work/customer-save-diagnosis-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Prove the autofill regression fails on accepted source
        run: node tools/verify-customer-autofill-regression.cjs
      - name: Prepare disposable Redis
        run: |
          set -euo pipefail
          if ! command -v redis-server >/dev/null || ! command -v redis-cli >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends redis-server redis-tools
          fi
          printf 'JAMES_TEST_REDIS_BIN=%s\n' "$(command -v redis-server)" >> "$GITHUB_ENV"
      - name: Run full regressions
        run: npm test
      - run: npm audit --omit=dev
