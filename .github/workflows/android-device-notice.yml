name: Android completion alert proof
on:
  pull_request:
    branches: [work/hosted-preparation-proof-20261113]
    paths:
      - 'device-check*'
      - 'lib/**/device-proof.*'
      - 'tests/device-notice*'
      - '.github/workflows/android-device-notice.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a node --test tests/device-notice*.test.js tests/task-hosted-transport.test.js tests/task-dispatch*.test.js
