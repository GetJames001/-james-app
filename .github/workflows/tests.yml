name: Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  windows-powershell-compatibility:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Verify credential helper with Windows PowerShell 5.1
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1."
          }

          # Git for Windows cannot materialize an unrelated legacy repository
          # filename ending in a dot. Fetch only the reviewed helper at the
          # exact PR head with this job's read-only repository token.
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $uri = "https://api.github.com/repos/${{ github.repository }}/contents/tools/Generate-JamesPreviewCredentials.ps1?ref=${{ github.event.pull_request.head.sha }}"
          $response = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get
          $helperPath = Join-Path $env:RUNNER_TEMP "Generate-JamesPreviewCredentials.ps1"
          $helperBytes = [Convert]::FromBase64String(($response.content -replace "\s", ""))
          [IO.File]::WriteAllBytes($helperPath, $helperBytes)

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $helperPath -SelfTest
          if ($LASTEXITCODE -ne 0) {
            throw "Credential helper compatibility self-test failed."
          }
