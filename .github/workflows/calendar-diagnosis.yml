name: Calendar refresh diagnosis
on:
  push:
    branches: [fix/calendar-refresh-diagnosis-20261031]
  pull_request:
    branches: [integration/recovered-entrance-20261031]
permissions:
  contents: read
jobs:
  calendar-regressions:
    if: github.event_name == 'push' || github.head_ref == 'fix/calendar-refresh-diagnosis-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm audit --omit=dev
