name: Calendar refresh diagnosis
on:
  push:
    branches: [fix/calendar-refresh-diagnosis-20261031, work/mail-reader-content-20261114]
  pull_request:
    branches: [integration/recovered-entrance-20261031, fix/calendar-refresh-diagnosis-20261031]
permissions:
  contents: read
jobs:
  calendar-regressions:
    if: github.event_name == 'push' || github.head_ref == 'fix/calendar-refresh-diagnosis-20261031' || github.head_ref == 'work/mail-reader-content-20261114' || github.head_ref == 'fix/briefing-location-20261114' || github.head_ref == 'fix/android-location-recovery-20261114' || github.head_ref == 'fix/attention-relevance-20261114' || github.head_ref == 'feature/saved-mail-review-20261114' || github.head_ref == 'feature/review-alert-receiver-20261114' || github.head_ref == 'feature/review-alert-enrollment-20261114' || github.head_ref == 'fix/customer-save-combined-20261114' || github.head_ref == 'feature/background-mail-combined-20261114' || github.head_ref == 'feature/ongoing-mail-alerts' || github.head_ref == 'feature/private-travel-cards-20261115' || github.head_ref == 'feature/briefing-travel-calendar-20261115' || github.head_ref == 'review/ipad-cleanup-20261116' || github.head_ref == 'fix/briefing-trip-refresh' || github.head_ref == 'feature/simple-tasks' || github.head_ref == 'feature/important-folder-review' || github.head_ref == 'fix/online-briefing-card' || github.head_ref == 'feature/james-user-guide' || github.head_ref == 'feature/lifestyle-magazine' || github.head_ref == 'feature/editorial-photo-panels' || github.head_ref == 'fix/briefing-finance-travel-cards' || github.head_ref == 'feature/finance-photo-stories' || github.head_ref == 'feature/lifestyle-content-entrances' || github.head_ref == 'feature/weather-skyline'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Prepare disposable local Redis verification
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v redis-server >/dev/null 2>&1 || ! command -v redis-cli >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends redis-server redis-tools
          fi
          redis_binary="$(command -v redis-server)"
          test -x "$(dirname "$redis_binary")/redis-cli"
          printf 'JAMES_TEST_REDIS_BIN=%s\n' "$redis_binary" >> "$GITHUB_ENV"
      - run: npm test
        env:
          JAMES_CARD_PREVIEWS: ${{ github.head_ref == 'fix/briefing-finance-travel-cards' && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: github.head_ref == 'fix/briefing-finance-travel-cards'
        with:
          name: card-previews
          path: card-previews/
          retention-days: 3
      - run: npm audit --omit=dev
      - name: Verify public lifestyle feed access
        if: github.head_ref == 'feature/lifestyle-content-entrances'
        run: |
          node <<'NODE'
          const handler = require('./lib/routes/lifestyle-feed');
          const auth = require('./lib/auth');
          process.env.JAMES_AUTH_EMAIL = 'fixture@example.test';
          process.env.JAMES_SESSION_SECRET = 'public-source-check-fixture-only';
          const headers = {host:'www.getjames.ai',cookie:auth.SESSION_COOKIE+'='+auth.createSessionToken(process.env.JAMES_AUTH_EMAIL)};
          (async()=>{
            for (const source of ['business','sales-books','business-books','life-books']) {
              const res = {setHeader(){},status(code){this.code=code;return this},json(data){this.data=data}};
              await handler({method:'GET',headers,query:{source}},res);
              const first = res.data?.items?.[0];
              console.log(source, res.code || 200, res.data?.items?.length || 0, first?.url || '');
              if (source === 'business') {
                if (!first) throw Error('No live public release');
                const page = await fetch(first.url);
                if (!page.ok || !page.headers.get('content-type')?.includes('text/html')) throw Error('Release unavailable');
                console.log('Public article opens',page.status);
              }
            }
          })().catch(error=>{console.error(error.message);process.exitCode=1});
          NODE
  render-weather-comparison:
    if: github.head_ref == 'review/weather-city-comparison'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Render the four card comparison
        run: |
          cat > review.cjs <<'NODE'
          const fs=require('fs'),{chromium}=require('playwright');
          (async()=>{
           const cities=[['Portland',45.5,-122.7],['San Francisco',37.8,-122.4],['Los Angeles',34.1,-118.2],['Las Vegas',36.2,-115.1]];
           const profiles=[];
           for(const [name,lat,lon] of cities.slice(0,3)){
            const url=new URL('https://api.open-meteo.com/v1/elevation');
            url.search=new URLSearchParams({latitude:Array(17).fill((lat+.07).toFixed(3)).join(','),longitude:Array.from({length:17},(_,i)=>(((lon+(i-8)*.014/Math.cos(lat*Math.PI/180)+540)%360)-180).toFixed(3)).join(',')});
            const r=await fetch(url);if(!r.ok)throw Error(name+' '+r.status);
            const {elevation}=await r.json();if(elevation.length!==17)throw Error(name);
            profiles.push(elevation);
           }
           console.log('ELEVATIONS '+JSON.stringify(profiles));
           const css=fs.readFileSync('styles.css','utf8');
           const card=fs.readFileSync('index.html','utf8').match(/<div id="weatherSquare"[\s\S]+?(?=\s*<div class="intel-card mail-card")/)[0];
           const sheets=cities.map(([name],i)=>{
            const h=profiles[i];
            const profile=h?'--local-horizon:polygon(0 100%, '+h.map((v,i)=>100*i/16+'% '+(72-Math.min(46,(v-Math.min(...h))/22))+'%').join(', ')+', 100% 100%)':'';
            return '<section><h2>'+name+'</h2>'+card.replace('id="weatherSquare"','id="weatherSquare" data-scene="rain" data-place="'+(h?'local':'las-vegas')+'" style="'+profile+'"').replace('>WEATHER<',h?'>Weather<':'>Weather · Las Vegas<').replace('id="weatherTemp">—','id="weatherTemp">58°').replace('id="weatherDetail">—','id="weatherDetail">Rain')+'</section>';
           }).join('');
           const html='<style>'+css+'</style><style>html,body{margin:0!important;background:#081525;color:#fff6df;}#review{padding:18px 24px;}#app{display:block!important;position:static!important;padding:0!important;opacity:1!important;}#briefing{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px}#review h2{font:500 21px Georgia;color:#f4e9d7;margin:0 0 5px}#review h1{font:500 27px Georgia;margin:0 0 4px}#review p{font:14px Arial;color:#d5c8b1;margin:0 0 12px}#app #briefing #weatherSquare{box-sizing:border-box;width:100%;height:178px;display:flex;flex-flow:column;align-items:start;justify-content:center;gap:3px;padding:13px 16px;color:white}#review .intel-icon{width:20px;height:20px}#review #weatherHeading{font:600 11px Arial;letter-spacing:2px}#review #weatherTemp{font:600 33px Georgia}#review #weatherDetail,#review .weather-location{font:14px Arial}#review .weather-location{margin:0}</style><div id="review"><h1>Rain in the Weather square</h1><p>Same sample conditions in all four cities</p><div id="app"><div id="briefing">'+sheets+'</div></div></div>';
           fs.writeFileSync('weather-comparison.html',html);
           const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
           const page=await browser.newPage({viewport:{width:690,height:530}});
           await page.goto('file://'+process.cwd()+'/weather-comparison.html');await page.waitForTimeout(250);
           fs.mkdirSync('frames');
           for(let i=0;i<32;i++){await page.evaluate(ms=>{for(const a of document.getAnimations()){a.pause();a.currentTime=ms;}},i*80);await page.screenshot({path:'frames/'+String(i).padStart(2,'0')+'.png'});}
           await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          node review.cjs
          if ! command -v ffmpeg >/dev/null; then sudo apt-get -qq update && sudo apt-get -yqq install ffmpeg; fi
          ffmpeg -loglevel error -framerate 12.5 -i frames/%02d.png -c:v libx264 -preset fast -crf 26 -pix_fmt yuv420p -movflags +faststart weather.mp4
          echo REVIEW_BEGIN
          base64 -w 2500 weather.mp4
          echo REVIEW_END
