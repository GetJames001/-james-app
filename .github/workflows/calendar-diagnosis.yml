name: Calendar refresh diagnosis
on:
  push:
    branches: [fix/calendar-refresh-diagnosis-20261031, work/mail-reader-content-20261114]
  pull_request:
    branches: [integration/recovered-entrance-20261031, fix/calendar-refresh-diagnosis-20261031]
permissions:
  contents: read
jobs:
  calendar-regressions:
    if: github.event_name == 'push' || github.head_ref == 'fix/calendar-refresh-diagnosis-20261031' || github.head_ref == 'work/mail-reader-content-20261114' || github.head_ref == 'fix/briefing-location-20261114' || github.head_ref == 'fix/android-location-recovery-20261114' || github.head_ref == 'fix/attention-relevance-20261114' || github.head_ref == 'feature/saved-mail-review-20261114' || github.head_ref == 'feature/review-alert-receiver-20261114' || github.head_ref == 'feature/review-alert-enrollment-20261114' || github.head_ref == 'fix/customer-save-combined-20261114' || github.head_ref == 'feature/background-mail-combined-20261114' || github.head_ref == 'feature/ongoing-mail-alerts' || github.head_ref == 'feature/private-travel-cards-20261115' || github.head_ref == 'feature/briefing-travel-calendar-20261115' || github.head_ref == 'review/ipad-cleanup-20261116' || github.head_ref == 'fix/briefing-trip-refresh' || github.head_ref == 'feature/simple-tasks' || github.head_ref == 'feature/important-folder-review' || github.head_ref == 'fix/online-briefing-card' || github.head_ref == 'feature/james-user-guide' || github.head_ref == 'feature/lifestyle-magazine' || github.head_ref == 'feature/editorial-photo-panels'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Prepare disposable local Redis verification
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v redis-server >/dev/null 2>&1 || ! command -v redis-cli >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends redis-server redis-tools
          fi
          redis_binary="$(command -v redis-server)"
          test -x "$(dirname "$redis_binary")/redis-cli"
          printf 'JAMES_TEST_REDIS_BIN=%s\n' "$redis_binary" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm audit --omit=dev
