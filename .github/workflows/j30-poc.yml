name: J30 isolated proof of concept
on:
  pull_request:
    branches: [integration/workbench-host-20261028]
    paths: ['j30/**', 'tests/j30*.test.js', '.github/workflows/j30-poc.yml']
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/j30.test.js tests/j30.browser.test.js
      - run: node j30/preflight.cjs
